[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rff_gpa"
version = "0.1.0"
description = "Random feature Gaussian process attention (arXiv:2610.08578)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rff_gpa*"]

[tool.pytest.ini_options]
pythonpath = ["."]
